x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  restart: unless-stopped
  env_file: .env
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW_CONN_DSP_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    PYTHONPATH: /opt/airflow
    RAW_DATA_DIR: /opt/airflow/data/raw_data
    GOOD_DATA_DIR: /opt/airflow/data/good_data
    BAD_DATA_DIR: /opt/airflow/data/bad_data
    PREDICTION_GOOD_DATA_DIR: /opt/airflow/data/good_data
    PREDICTION_STATE_FILE: /opt/airflow/data/prediction_state/processed_files.json
    PREDICTION_API_URL: http://api:8000
    # Base of the clickable report links in Data Quality alerts.
    DATA_DOCS_PUBLIC_URL: ${DATA_DOCS_PUBLIC_URL:-http://localhost:8081}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
    mlflow:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    env_file: .env
    environment:
      <<: *airflow-environment
    command: ["airflow", "db", "migrate"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: ["airflow", "api-server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    restart: unless-stopped
    env_file: .env
    command:
      - sh
      - -c
      - >-
        python /opt/mlflow_create_db.py
        && exec mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
    volumes:
      - ./mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5000:5000"

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3000/
      # Read by the provisioning files in grafana/provisioning.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Grafana refuses an empty webhook URL, so unset channels get a
      # placeholder that fails delivery instead of blocking startup.
      TEAMS_DATA_QUALITY_URL: ${TEAMS_WEBHOOK_URL:-http://alerts-not-configured.invalid/data-quality}
      TEAMS_ML_URL: ${TEAMS_ML_ALERTS_WEBHOOK_URL:-http://alerts-not-configured.invalid/ml}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      # The API creates the tables and views the alert rules query; without
      # it a new stack starts with DatasourceError alerts.
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  data-docs:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./data/gx/gx/uncommitted/data_docs/local_site:/usr/share/nginx/html:ro
    ports:
      - "8081:80"

volumes:
  postgres_data:
  airflow_logs:
  grafana_data:
