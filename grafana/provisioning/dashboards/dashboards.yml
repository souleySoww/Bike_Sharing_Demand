apiVersion: 1

# Each sub-folder of grafana/dashboards becomes a Grafana folder:
# data-quality/ for the data operations team, ml-monitoring/ for ML engineers.
providers:
  - name: dsp-dashboards
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
