apiVersion: 1

datasources:
  - name: DSP PostgreSQL
    uid: dsp-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
