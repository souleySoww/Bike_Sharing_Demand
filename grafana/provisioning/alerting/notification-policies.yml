apiVersion: 1

# Every alert rule must carry a "team" label:
#   team=data-quality -> Data Quality Alerts (ingestion errors, validation)
#   team=ml           -> ML Alerts (drift, prediction anomalies)
policies:
  - orgId: 1
    receiver: Data Quality Alerts
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 2m
    repeat_interval: 1h
    routes:
      - receiver: ML Alerts
        object_matchers:
          - ["team", "=", "ml"]
      - receiver: Data Quality Alerts
        object_matchers:
          - ["team", "=", "data-quality"]
